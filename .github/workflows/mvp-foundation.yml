name: MVP Checks

on:
  pull_request:
    paths:
      - 'mvp/**'
      - '.github/workflows/mvp-foundation.yml'
  push:
    branches: [main]
    paths:
      - 'mvp/**'
      - '.github/workflows/mvp-foundation.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: medidocta_test
          POSTGRES_USER: medidocta
          POSTGRES_PASSWORD: medidocta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medidocta -d medidocta_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://medidocta:medidocta@127.0.0.1:5432/medidocta_test
      DATABASE_URL: postgres://medidocta:medidocta@127.0.0.1:5432/medidocta_test
      AUTH_MODE: dev
      NODE_ENV: test
    defaults:
      run:
        working-directory: mvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run check
      - run: npm run migrate
      - run: npm test
