name: MVP Foundation Checks

on:
  pull_request:
    paths:
      - 'mvp/**'
      - '.github/workflows/mvp-foundation.yml'
  push:
    branches: [main]
    paths:
      - 'mvp/**'
      - '.github/workflows/mvp-foundation.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run check
      - run: npm test
